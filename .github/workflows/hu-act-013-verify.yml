name: HU-ACT-013 verification

on:
  push:
    branches: [hu-013-dev]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out actors-service
        uses: actions/checkout@v4
        with:
          path: actors-service

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: actors-service/pom.xml

      # Keep the PR gate independent from actors-db and Docker infrastructure.
      - name: Run unit tests
        working-directory: actors-service
        run: |
          mvn --batch-mode --no-transfer-progress \
            -Dtest='**/*Test' \
            -DfailIfNoTests=false \
            -Dsurefire.failIfNoSpecifiedTests=false \
            clean test

      - name: Upload Maven reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hu-act-013-maven-reports
          if-no-files-found: warn
          path: |
            actors-service/**/target/surefire-reports/**
            actors-service/**/target/failsafe-reports/**
