name: HU-ACT-010 verification

on:
  push:
    branches:
      - feat/hu-act-010-dev
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Maven test and verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # The baseline/R5 gate is self-contained. Liquibase and Testcontainers
      # verification belongs to an environment job and must not require a
      # cross-repository token for every PR.
      - name: Run unit and application tests
        run: |
          mvn --batch-mode --no-transfer-progress \
            -Dtest='**/*Test' \
            -DfailIfNoTests=false \
            -Dsurefire.failIfNoSpecifiedTests=false \
            clean test

      - name: Upload Maven test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hu-act-010-maven-reports
          if-no-files-found: warn
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
            **/target/*.dump
            **/target/*.dumpstream
